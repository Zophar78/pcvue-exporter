pcvue:
  base_url: "${PCVUE_BASE_URL}"
  insecure_skip_verify: true
  timeout: "10s"

  auth:
    type: "oauth2_password"
    token_url: "${PCVUE_TOKEN_URL}"
    client_id: "${PCVUE_CLIENT_ID}"
    client_secret: "${PCVUE_CLIENT_SECRET}"
    username: "${PCVUE_USERNAME}"
    password: "${PCVUE_PASSWORD}"
    scopes:
      - "RealtimeData"
      - "RealtimeAlarm"

labels:
  site: "lausanne"
  environment: "prd"

variables:
  - name: "SITE_A.TEMPERATURE.SENSOR_1.TEMPERATURE_VALUE"
    type: "gauge"
    area: "area_a"
